<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SmartHire Agent</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg:          #07080c;
  --surface:     #0e0f14;
  --card:        rgba(255,255,255,0.04);
  --card2:       rgba(255,255,255,0.06);
  --border:      rgba(255,255,255,0.08);
  --border2:     rgba(255,255,255,0.12);
  --text:        #e8eaf0;
  --muted:       #5a5f7a;
  --muted2:      #8890b0;
  --accent:      #6366f1;
  --accent-dim:  rgba(99,102,241,0.1);
  --accent-glow: rgba(99,102,241,0.25);
  --green:       #22c55e;
  --green-bg:    rgba(34,197,94,0.1);
  --green-glow:  rgba(34,197,94,0.2);
  --red:         #ef4444;
  --red-bg:      rgba(239,68,68,0.1);
  --yellow:      #f59e0b;
  --blue:        #60a5fa;
  --orange:      #f97316;
  --purple:      #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Dot grid */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image: radial-gradient(circle, #ffffff06 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
}

/* ── Header ── */
header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 56px;
  background: rgba(0,0,0,0.4);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 15px; font-weight: 700; letter-spacing: -.2px; color: #fff;
  text-decoration: none;
}
.logo-mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
}
.header-right { display: flex; align-items: center; gap: 10px; }
.session-chip {
  display: none; align-items: center; gap: 6px;
  font-size: 11px; font-family: monospace; color: var(--muted2);
  background: var(--card); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 10px;
}
.session-chip::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 6px var(--green);
}
.ghost-btn {
  font-size: 12px; font-weight: 500; padding: 5px 12px;
  border-radius: 6px; border: 1px solid var(--border);
  background: var(--card); color: var(--muted2); cursor: pointer;
  transition: all .15s; display: none;
}
.ghost-btn:hover { border-color: var(--border2); color: var(--text); }

/* ── App shell ── */
#app {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  min-height: calc(100vh - 56px);
}

/* ── Pipeline strip ── */
.pipeline-strip {
  display: none;
  justify-content: center;
  padding: 28px 40px 0;
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.pipeline-strip::-webkit-scrollbar { height: 4px; }
.pipeline-strip::-webkit-scrollbar-track { background: transparent; }
.pipeline-strip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.pipeline-row {
  display: flex; align-items: center;
  min-width: max-content; gap: 0;
  padding-bottom: 4px;
}

/* Node */
.p-node { display: flex; align-items: center; flex-direction: column; }

.node-shell {
  position: relative;
  width: 148px;
  transition: all .3s;
}

.node-card {
  width: 148px;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 16px 14px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  transition: all .3s;
  position: relative; overflow: hidden;
  cursor: default;
  box-shadow: 0 4px 24px rgba(0,0,0,0.2);
}

/* Shimmer line at top of card */
.node-card::after {
  content: '';
  position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
  border-radius: 1px;
  background: transparent;
  transition: background .3s;
}

.node-icon {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
  transition: all .3s;
}
.ni-trigger { background: #1f1208; border: 1px solid #f9731628; }
.ni-agent   { background: #11113a; border: 1px solid #6366f128; }
.ni-hitl    { background: #1a1606; border: 1px solid #f59e0b28; }
.ni-done    { background: var(--green-bg); border: 1px solid #22c55e28; }

.node-label { font-size: 12px; font-weight: 600; color: var(--muted2); text-align: center; line-height: 1.3; }
.node-type  { font-size: 10px; color: var(--muted); text-align: center; font-weight: 500; letter-spacing: .02em; }

/* Status badge on node */
.node-badge {
  position: absolute; top: 9px; right: 9px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--border2);
  transition: all .3s;
}

/* — pending — */
.p-node.st-pending .node-card { opacity: .4; }

/* — active — */
.p-node.st-active .node-card {
  border-color: var(--accent);
  background: #0e0e1f;
  box-shadow: 0 0 0 1px var(--accent-glow), 0 0 30px var(--accent-dim);
}
.p-node.st-active .node-card::after { background: var(--accent); opacity: .7; }
.p-node.st-active .node-badge {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
  animation: badge-pulse 1.4s ease-in-out infinite;
}
.p-node.st-active .node-label { color: var(--text); }
.p-node.st-active .ni-agent { background: #1a1a4a; border-color: #6366f148; }
.p-node.st-active .ni-hitl  { background: #241f08; border-color: #f59e0b48; }
.p-node.st-active .ni-trigger { background: #281a08; border-color: #f9731648; }

/* — done — */
.p-node.st-done .node-card {
  border-color: #1a4028;
  background: #0b1610;
  cursor: pointer;
}
.p-node.st-done .node-card:hover {
  border-color: #22c55e66;
  box-shadow: 0 0 20px var(--green-glow);
}
.p-node.st-done .node-card::after { background: var(--green); opacity: .6; }
.p-node.st-done .node-badge { background: var(--green); box-shadow: 0 0 6px var(--green); }
.p-node.st-done .node-label { color: #86efac; }
.p-node.st-done .node-type  { color: var(--green); }

/* Pulse ring behind active node */
.node-pulse {
  display: none;
  position: absolute; inset: -5px; border-radius: 18px;
  border: 1.5px solid var(--accent); opacity: 0;
  animation: node-ring 2.2s ease-in-out infinite;
  pointer-events: none;
}
.p-node.st-active .node-pulse { display: block; }

@keyframes node-ring {
  0%,100% { opacity: 0; transform: scale(1); }
  50%      { opacity: .35; transform: scale(1.04); }
}
@keyframes badge-pulse {
  0%,100% { opacity: 1; }
  50%      { opacity: .4; }
}

/* ── Connector ── */
.connector {
  display: flex; align-items: center;
  width: 44px; flex-shrink: 0;
  position: relative;
}
.conn-svg { width: 44px; height: 24px; overflow: visible; }
.conn-line {
  stroke: var(--border2); stroke-width: 1.5; fill: none;
  stroke-dasharray: 4 3;
  transition: stroke .4s;
}
.conn-line.fl-active {
  stroke: var(--accent);
  stroke-dasharray: 5 3;
  animation: flow .7s linear infinite;
}
.conn-line.fl-done {
  stroke: #1a5c30;
  stroke-dasharray: none;
}
.conn-arrow {
  transition: fill .4s;
  fill: var(--border2);
}
.fl-active .conn-arrow { fill: var(--accent); }
.fl-done   .conn-arrow { fill: #1a5c30; }

@keyframes flow { to { stroke-dashoffset: -22; } }

/* ── Content area ── */
.content-area {
  flex: 1; padding: 32px 40px 48px;
  max-width: 920px; width: 100%; margin: 0 auto;
}

/* ── Upload screen ── */
.upload-hero {
  text-align: center; padding: 48px 0 36px;
}
.upload-hero h1 {
  font-size: 32px; font-weight: 800; letter-spacing: -.6px; margin-bottom: 10px;
  background: linear-gradient(135deg, #e8eaf0 0%, #8890b0 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.upload-hero p { color: var(--muted2); font-size: 15px; line-height: 1.6; }

.upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
.upload-label {
  font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 8px;
}

.dropzone {
  border: 1.5px dashed var(--border2); border-radius: 12px;
  padding: 28px 20px; text-align: center; cursor: pointer;
  transition: all .2s; position: relative; background: var(--surface);
  min-height: 120px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
}
.dropzone:hover, .dropzone.drag-over {
  border-color: var(--accent); background: var(--accent-dim);
}
.dropzone.filled { border-color: var(--green); border-style: solid; background: #0a1f1288; }
.dropzone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.dz-icon  { font-size: 28px; }
.dz-label { font-size: 13px; font-weight: 600; color: var(--text); }
.dz-hint  { font-size: 11px; color: var(--muted); }

.file-chips { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
.file-chip {
  display: flex; align-items: center; gap: 7px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 10px; font-size: 12px;
}
.fc-name { color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fc-size { color: var(--muted); flex-shrink: 0; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 600;
  cursor: pointer; border: none; font-family: inherit; transition: all .18s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }

.btn-primary {
  background: var(--accent); color: #fff; width: 100%;
  font-size: 15px; padding: 14px;
  box-shadow: 0 4px 20px var(--accent-glow);
}
.btn-primary:hover:not(:disabled) {
  background: #7476f5;
  box-shadow: 0 4px 28px #6366f155;
}

.btn-approve {
  background: var(--green-bg); color: var(--green);
  border: 1px solid #1a5c30;
  box-shadow: 0 0 16px #22c55e10;
}
.btn-approve:hover { background: #0d2a19; box-shadow: 0 0 20px #22c55e20; }

.btn-reject {
  background: var(--red-bg); color: var(--red);
  border: 1px solid #5c1a1a;
}
.btn-reject:hover { background: #220a0a; }

.btn-outline {
  background: var(--card); color: var(--muted2);
  border: 1px solid var(--border);
}
.btn-outline:hover { border-color: var(--border2); color: var(--text); }

.btn-ghost {
  background: transparent; color: var(--muted2);
  border: 1px solid var(--border);
  padding: 8px 16px; font-size: 13px;
}
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

/* ── Section head ── */
.sec-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
}
.sec-head h2 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
.count-pill {
  font-size: 12px; color: var(--muted2); background: var(--card);
  border: 1px solid var(--border); border-radius: 99px; padding: 3px 12px;
}

/* ── Working / Agent active ── */
.agent-stage {
  background: var(--card); border: 1px solid var(--accent);
  border-radius: 18px; padding: 56px 32px; text-align: center;
  box-shadow: 0 0 60px var(--accent-dim);
  position: relative; overflow: hidden;
}
.agent-stage::before {
  content: '';
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 60%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}
.glow-ring {
  width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 28px;
  background: var(--accent-dim); border: 1.5px solid var(--accent);
  display: flex; align-items: center; justify-content: center; font-size: 32px;
  position: relative;
  animation: glow-pulse 2.2s ease-in-out infinite;
}
.glow-ring::before {
  content: ''; position: absolute; inset: -10px; border-radius: 50%;
  border: 1.5px solid var(--accent); opacity: .25;
  animation: glow-ring-outer 2.2s ease-in-out infinite;
}
.glow-ring::after {
  content: ''; position: absolute; inset: -22px; border-radius: 50%;
  border: 1px solid var(--accent); opacity: .1;
  animation: glow-ring-outer 2.2s ease-in-out infinite .2s;
}
@keyframes glow-pulse      { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
@keyframes glow-ring-outer { 0%,100%{transform:scale(1);opacity:.25} 50%{transform:scale(1.2);opacity:.06} }

.agent-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-dim); border-radius: 99px;
  padding: 4px 12px; margin-bottom: 14px;
}
.agent-pill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: badge-pulse 1.4s ease-in-out infinite; }
.agent-title { font-size: 24px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 10px; }
.agent-desc  { font-size: 14px; color: var(--muted2); max-width: 420px; margin: 0 auto; line-height: 1.75; }

/* ── Candidate card ── */
.cand-grid { display: grid; gap: 10px; margin-bottom: 18px; }
.cand-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px 20px;
  transition: border-color .2s;
}
.cand-card:hover { border-color: var(--border2); }
.cand-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
.cand-name { font-size: 15px; font-weight: 700; }
.cand-role { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* Circular score */
.score-donut {
  width: 50px; height: 50px; flex-shrink: 0; position: relative;
}
.score-donut svg { width: 50px; height: 50px; transform: rotate(-90deg); }
.donut-bg   { fill: none; stroke: var(--border); stroke-width: 4; }
.donut-fill { fill: none; stroke-width: 4; stroke-linecap: round; transition: stroke-dasharray .5s; }
.score-num {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: var(--green);
}

.cand-reason {
  font-size: 13px; color: var(--muted2); line-height: 1.65;
  padding: 10px 14px; background: var(--surface); border-radius: 8px;
  margin-bottom: 12px; border-left: 3px solid var(--accent);
}
.cand-meta { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.cand-meta span { display: flex; align-items: center; gap: 4px; }
.skills { display: flex; flex-wrap: wrap; gap: 5px; }
.skill-pill {
  font-size: 11px; padding: 2px 8px; border-radius: 4px;
  background: #11224088; border: 1px solid #1e3a5f55; color: #7db8f7;
}

/* ── Call card ── */
.call-grid { display: grid; gap: 8px; margin-bottom: 18px; }
.call-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 13px 16px;
  display: flex; align-items: center; gap: 13px;
}
.call-av {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
}
.call-info  { flex: 1; }
.call-name  { font-size: 13px; font-weight: 600; }
.call-phone { font-size: 11px; color: var(--muted); margin-top: 2px; }

.sbadge {
  font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 99px;
}
.sb-calling   { background:#11224088; color:var(--blue);   border:1px solid #1e3a8a55; }
.sb-completed { background:var(--green-bg); color:var(--green); border:1px solid #1a5c30; }
.sb-failed    { background:var(--red-bg);   color:var(--red);   border:1px solid #5c1a1a; }
.sb-noanswer  { background:#1a1306;  color:var(--yellow); border:1px solid #78350f55; }
.sb-waiting   { background:var(--card); color:var(--muted); border:1px solid var(--border); }

.spinner {
  display: inline-block; width: 9px; height: 9px; border-radius: 50%;
  border: 1.5px solid var(--blue); border-top-color: transparent;
  animation: spin .55s linear infinite; vertical-align: middle; margin-right: 4px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Screening result ── */
.res-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px 20px; margin-bottom: 10px;
}
.res-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.res-name { font-size: 15px; font-weight: 700; }
.res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.res-field {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px;
}
.rf-label { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 4px; }
.rf-val   { font-size: 13px; font-weight: 500; }
.rf-yes   { color: var(--green); }
.rf-no    { color: var(--red); }

/* ── Action card ── */
.action-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px;
}
.action-row { display: flex; gap: 10px; }
.action-row .btn { flex: 1; }
.fb-box { margin-top: 12px; display: none; }
.fb-box textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); padding: 11px 14px; font-size: 13px;
  resize: vertical; min-height: 80px; outline: none; margin-bottom: 10px;
  font-family: inherit; line-height: 1.6;
}
.fb-box textarea:focus { border-color: var(--accent); }
.fb-box textarea::placeholder { color: var(--muted); }

/* ── Rationale box ── */
.rationale-box {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;
}
.rationale-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 7px; }
.rationale-text  { font-size: 13px; color: var(--muted2); line-height: 1.7; }

/* ── Complete screen ── */
.complete-stage {
  text-align: center; padding: 64px 32px;
  background: var(--card); border: 1px solid #1a5c30;
  border-radius: 18px; position: relative; overflow: hidden;
  box-shadow: 0 0 60px #22c55e0d;
}
.complete-stage::before {
  content: '';
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 50%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--green), transparent);
}
.check-circle {
  width: 80px; height: 80px; border-radius: 50%;
  background: var(--green-bg); border: 1.5px solid #1a5c30;
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; margin: 0 auto 24px;
  box-shadow: 0 0 40px var(--green-glow);
}
.complete-title { font-size: 28px; font-weight: 800; letter-spacing: -.5px; margin-bottom: 8px; }
.complete-sub   { font-size: 14px; color: var(--muted2); margin-bottom: 32px; line-height: 1.6; }
.complete-btns  { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* ── Error screen ── */
.error-stage {
  text-align: center; padding: 56px 32px;
  background: var(--card); border: 1px solid #5c1a1a;
  border-radius: 18px; box-shadow: 0 0 40px #ef444410;
}
.error-icon  { font-size: 40px; margin-bottom: 16px; }
.error-title { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
.error-msg   { font-size: 14px; color: var(--muted2); margin-bottom: 24px; line-height: 1.7; max-width: 480px; margin-left: auto; margin-right: auto; }

/* ── Calling note ── */
.call-note { text-align: center; padding: 16px; color: var(--muted); font-size: 13px; }
.call-note strong { color: var(--blue); }

/* ── Panel drawer ── */
.overlay {
  position: fixed; inset: 0; background: #00000090;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  z-index: 200; display: none;
}
.overlay.open { display: block; }
.drawer {
  position: fixed; right: 0; top: 0; bottom: 0; width: 520px; max-width: 96vw;
  background: #0e0f16; border-left: 1px solid var(--border);
  z-index: 201; overflow-y: auto; padding: 26px;
  animation: drawerIn .22s cubic-bezier(.4,0,.2,1);
}
@keyframes drawerIn { from{transform:translateX(100%)} to{transform:translateX(0)} }
.drawer-head {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;
}
.drawer-title { font-size: 15px; font-weight: 700; }
.drawer-close {
  background: var(--card); border: 1px solid var(--border); color: var(--muted2);
  width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; line-height: 1;
}
.drawer-close:hover { border-color: var(--border2); color: var(--text); }

/* ── Onboarding candidate selector ── */
.onb-grid { display: grid; gap: 8px; margin-bottom: 18px; }

.onb-card {
  display: flex; align-items: center; gap: 14px;
  background: var(--card); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 14px 16px;
  cursor: pointer; transition: all .18s; user-select: none;
}
.onb-card:hover { border-color: var(--border2); }
.onb-card.selected {
  border-color: var(--green);
  background: #0b1610;
  box-shadow: 0 0 0 1px #22c55e18;
}

.onb-checkbox-wrap {
  flex-shrink: 0; width: 22px; height: 22px; position: relative;
}
.onb-checkbox-wrap input[type=checkbox] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0;
  width: 100%; height: 100%;
}
.onb-check-box {
  width: 22px; height: 22px; border-radius: 6px;
  border: 1.5px solid var(--border2);
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: transparent;
  transition: all .15s;
}
.onb-card.selected .onb-check-box {
  background: var(--green); border-color: var(--green); color: #fff;
}

.onb-info { flex: 1; min-width: 0; }
.onb-name  { font-size: 14px; font-weight: 600; }
.onb-email { font-size: 12px; color: var(--muted); margin-top: 2px; }
.onb-slot  { font-size: 12px; color: var(--muted2); margin-top: 4px; }

.onb-badge { flex-shrink: 0; }

/* ── Misc ── */
.divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }

/* ── Conversation UI ── */
.conv-container { max-width: 700px; margin: 0 auto; }
.conv-header { text-align: center; margin-bottom: 24px; }
.conv-header h2 { font-size: 20px; margin-bottom: 6px; }
.conv-header p { color: var(--muted2); font-size: 13px; }
.conv-chat {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 20px; min-height: 300px;
  max-height: 400px; overflow-y: auto; margin-bottom: 16px;
}
.conv-bubble {
  display: flex; gap: 10px; margin-bottom: 14px;
  animation: fadeIn .3s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.conv-bubble.agent { flex-direction: row; }
.conv-bubble.user { flex-direction: row-reverse; }
.conv-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.conv-bubble.agent .conv-avatar { background: var(--accent-dim); }
.conv-bubble.user .conv-avatar { background: var(--green-bg); }
.conv-msg {
  max-width: 80%; padding: 10px 14px; border-radius: 12px;
  font-size: 14px; line-height: 1.6; word-break: break-word;
}
.conv-bubble.agent .conv-msg { background: var(--card2); border: 1px solid var(--border); }
.conv-bubble.user .conv-msg { background: #1a2e1a; border: 1px solid #2d4a2d; }
.conv-controls {
  display: flex; gap: 10px; align-items: center;
}
.conv-input {
  flex: 1; background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 16px; color: var(--text);
  font-size: 14px; outline: none; resize: none;
  font-family: inherit;
}
.conv-input:focus { border-color: var(--accent); }
.conv-mic-btn {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--accent-dim); border: 2px solid var(--accent);
  color: var(--accent); font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
.conv-mic-btn:hover { background: var(--accent); color: #fff; }
.conv-mic-btn.recording {
  background: #ef4444; border-color: #ef4444; color: #fff;
  animation: pulse 1s infinite;
}
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 #ef444460; } 50% { box-shadow: 0 0 0 12px #ef444400; } }
.conv-send-btn {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--green); border: none; color: #fff;
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.conv-send-btn:disabled { opacity: .4; cursor: not-allowed; }
.conv-audio-btn {
  background: none; border: 1px solid var(--border); border-radius: 8px;
  color: var(--muted2); padding: 4px 10px; font-size: 12px; cursor: pointer;
  margin-top: 6px;
}
.conv-audio-btn:hover { border-color: var(--accent); color: var(--accent); }
.conv-status {
  text-align: center; padding: 8px; font-size: 12px; color: var(--muted2);
}
.conv-status .spinner { display: inline-block; width: 12px; height: 12px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite; margin-right: 6px; }
.conv-skip-bar {
  display: flex; justify-content: center; gap: 10px; margin-top: 16px;
}

/* ── Call Simulation View ── */
.call-sim-container { max-width: 700px; margin: 0 auto; }
.call-sim-header { text-align: center; margin-bottom: 20px; }
.call-sim-header h2 { font-size: 20px; margin-bottom: 4px; }
.call-sim-header p { color: var(--muted2); font-size: 13px; }
.call-sim-cards { display: flex; flex-direction: column; gap: 16px; }
.call-sim-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 20px;
}
.call-sim-card-head {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.call-sim-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--accent-dim); display: flex;
  align-items: center; justify-content: center; font-size: 20px;
}
.call-sim-name { font-weight: 700; font-size: 15px; }
.call-sim-status { font-size: 12px; color: var(--green); }
.call-sim-chat { display: flex; flex-direction: column; gap: 10px; }
.call-turn {
  display: flex; gap: 10px; animation: fadeIn .3s ease;
}
.call-turn.agent { flex-direction: row; }
.call-turn.candidate { flex-direction: row-reverse; }
.call-turn-icon {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.call-turn.agent .call-turn-icon { background: var(--accent-dim); }
.call-turn.candidate .call-turn-icon { background: var(--green-bg); }
.call-turn-bubble {
  max-width: 80%; padding: 10px 14px; border-radius: 12px;
  font-size: 14px; line-height: 1.6;
}
.call-turn.agent .call-turn-bubble { background: var(--card2); border: 1px solid var(--border); }
.call-turn.candidate .call-turn-bubble { background: #1a2e1a; border: 1px solid #2d4a2d; }
.call-turn-playing {
  display: inline-block; margin-left: 8px; color: var(--accent);
  animation: pulse 1s infinite;
}

/* ── Video Background ── */
.video-bg {
  position: fixed; inset: 0; z-index: -2;
  width: 100%; height: 100%; object-fit: cover;
  pointer-events: none;
}
.video-overlay {
  position: fixed; inset: 0; z-index: -1;
  background: rgba(0,0,0,0.7);
  pointer-events: none;
}
.grid-overlay {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.15;
  background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
}

/* ── Cold start tip ── */
.cold-tip {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  text-align: center; padding: 6px;
  background: rgba(234,179,8,0.05);
  border-top: 1px solid rgba(255,255,255,0.06);
  font-size: 11px; color: rgba(250,204,21,0.7);
}
</style>
</head>
<body>

<!-- Video Background -->
<video class="video-bg" autoplay muted loop playsinline>
  <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260809_012548_ef22562c-c0ae-4816-ad9d-f8922af4e6a7.mp4" type="video/mp4" />
</video>
<div class="video-overlay"></div>
<div class="grid-overlay"></div>

<header>
  <a class="logo" href="#">
    <div class="logo-mark">S</div>
    SmartHire
  </a>
  <div class="header-right">
    <div class="session-chip" id="session-chip"></div>
    <button class="ghost-btn" id="reset-btn" onclick="resetWorkflow()" style="color:var(--red)" title="重置整个流程">重置</button>
    <button class="ghost-btn" id="new-btn" onclick="newSession()">+ 新建流程</button>
  </div>
</header>

<div id="app">
  <!-- Pipeline strip (hidden on upload) -->
  <div class="pipeline-strip" id="pipeline-strip">
    <div class="pipeline-row" id="pipeline-row"></div>
  </div>

  <!-- Content -->
  <div class="content-area" id="content"></div>
</div>

<!-- Drawer -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer" style="display:none">
  <div class="drawer-head">
    <div class="drawer-title" id="drawer-title"></div>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div id="drawer-body"></div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────
const S = {
  sessionId:          localStorage.getItem('hr_session_id') || null,
  status:             null,
  callDetails:        null,
  timer:              null,
  view:               'upload',
  onboardingSubmitted: false,
};

// ─── Pipeline node definitions ────────────────────────────────────────────
const NODES = [
  { icon:'1',  label:'上传简历',       sub:'触发',     cls:'ni-trigger', panelIdx: null },
  { icon:'2',  label:'简历解析',       sub:'AI 智能体', cls:'ni-agent',   panelIdx: 0    },
  { icon:'3',  label:'短名单审核',     sub:'人工审核',  cls:'ni-hitl',    panelIdx: 1    },
  { icon:'4',  label:'AI电话预筛选',   sub:'AI 对话',   cls:'ni-agent',   panelIdx: 2    },
  { icon:'5',  label:'最终审核',       sub:'人工审核',  cls:'ni-hitl',    panelIdx: 3    },
  { icon:'6',  label:'面试安排',       sub:'AI 智能体', cls:'ni-agent',   panelIdx: 4    },
  { icon:'7',  label:'入职通知',       sub:'人工审核',  cls:'ni-hitl',    panelIdx: 5    },
  { icon:'8',  label:'完成',           sub:'流程结束',  cls:'ni-agent',   panelIdx: null },
];

const TERMINAL = new Set(['completed','failed','no_answer','no-answer','busy','canceled']);

// ─── Boot ─────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  if (S.sessionId) { showChip(S.sessionId); render('working'); startPolling(); }
  else render('upload');
});

// ─── Polling ──────────────────────────────────────────────────────────────
function startPolling() {
  if (S.timer) clearInterval(S.timer);
  poll();
  S.timer = setInterval(poll, 3000);
}
function stopPolling() { clearInterval(S.timer); S.timer = null; }

async function poll() {
  if (!S.sessionId) return;
  // 如果用户正在输入（textarea 获得焦点），跳过本次刷新
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT' && ae.type === 'text')) return;

  try {
    const r = await fetch(`/api/workflow/${S.sessionId}/status`);
    if (!r.ok) return;
    S.status = await r.json();
    const v = computeView();
    if (v === 'calling' || v === 'screening') {
      const cr = await fetch(`/api/workflow/${S.sessionId}/pre-screening`);
      if (cr.ok) S.callDetails = await cr.json();
    }
    const nv = computeView();
    const viewChanged = nv !== S.view;
    if (viewChanged) {
      S.view = nv;
      if (nv === 'complete') stopPolling();
      // 轮询接管后，关闭模拟流程标志
      // view changed
    }
    if (viewChanged || (S.view !== 'onboarding' && S.view !== 'onboarding_active')) {
      render(S.view);
    } else {
      renderPipeline(S.view);
    }
  } catch (e) { console.error(e); }
}

// ─── View machine ─────────────────────────────────────────────────────────
function allCallsDone() {
  const d = S.callDetails?.call_details || [];
  return d.length > 0 && d.every(c => TERMINAL.has(c.status));
}
function computeView() {
  if (!S.status) return 'working';
  const { shortlist_approval_status: sl, pre_screening_approval_status: ps,
          onboarding_approval_status: oa,
          shortlisted_candidates: cands = [], pre_screening_results: res = [],
          email_scheduling_results: esr = [], current_step: step = '', error } = S.status;
  if (error)                                                   return 'error';
  if (sl === 'pending' && cands.length > 0)                    return 'shortlist';
  if (step === 'onboarding_complete')                          return 'complete';
  if (step === 'onboarding_approved')                          return 'onboarding_active';
  if (step === 'emails_sent' || step === 'onboarding_pending') {
    return S.onboardingSubmitted ? 'onboarding_active' : 'onboarding';
  }
  if (ps === 'approved')                                       return 'scheduling';
  if (ps === 'pending' && res.length > 0)                      return 'screening';
  if (sl === 'approved' && res.length === 0 && allCallsDone()) return 'screening';
  if (Conv.active)                                             return 'conversation';
  if (sl === 'approved' && res.length === 0)                   return 'calling';
  return 'working';
}

// ─── Pipeline state per view ──────────────────────────────────────────────
function pipelineStates(view) {
  const slApproved = S.status?.shortlist_approval_status === 'approved';
  const map = {
    upload:      ['st-active','st-pending','st-pending','st-pending','st-pending','st-pending','st-pending','st-pending'],
    shortlist:   ['st-done',  'st-done',   'st-active', 'st-pending','st-pending','st-pending','st-pending','st-pending'],
    calling:     ['st-done',  'st-done',   'st-done',   'st-active', 'st-pending','st-pending','st-pending','st-pending'],
    screening:   ['st-done',  'st-done',   'st-done',   'st-done',   'st-active', 'st-pending','st-pending','st-pending'],
    scheduling:  ['st-done',  'st-done',   'st-done',   'st-done',   'st-done',   'st-active', 'st-pending','st-pending'],
    onboarding:        ['st-done','st-done','st-done','st-done','st-done','st-done','st-active','st-pending'],
    onboarding_active: ['st-done','st-done','st-done','st-done','st-done','st-done','st-active','st-pending'],
    complete:    ['st-done',  'st-done',   'st-done',   'st-done',   'st-done',   'st-done',   'st-done',   'st-done'],
    error:       ['st-pending','st-pending','st-pending','st-pending','st-pending','st-pending','st-pending','st-pending'],
  };
  if (view === 'working') {
    const psApproved = S.status?.pre_screening_approval_status === 'approved';
    if (psApproved)
      return ['st-done','st-done','st-done','st-done','st-done','st-active','st-pending','st-pending'];
    if (slApproved)
      return ['st-done','st-done','st-done','st-active','st-pending','st-pending','st-pending','st-pending'];
    return ['st-done','st-active','st-pending','st-pending','st-pending','st-pending','st-pending','st-pending'];
  }
  return map[view] || map.error;
}

// ─── Render pipeline ──────────────────────────────────────────────────────
function renderPipeline(view) {
  const states = pipelineStates(view);
  const el = document.getElementById('pipeline-row');
  let html = '';
  NODES.forEach((n, i) => {
    const st = states[i];
    const iconCls = st === 'st-done' ? 'ni-done' : n.cls;
    const clickable = (st === 'st-done' && n.panelIdx !== null)
      ? `onclick="openDrawer(${n.panelIdx})" title="View ${n.label} data"` : '';
    const sublabel = st === 'st-active' ? '● 进行中' : st === 'st-done' ? '✓ 完成' : n.sub;

    html += `<div class="p-node ${st}">
      <div class="node-shell">
        <div class="node-pulse"></div>
        <div class="node-card" ${clickable}>
          <div class="node-badge"></div>
          <div class="node-icon ${iconCls}">${n.icon}</div>
          <div class="node-label">${n.label}</div>
          <div class="node-type">${sublabel}</div>
        </div>
      </div>
    </div>`;

    if (i < NODES.length - 1) {
      const leftDone  = st === 'st-done';
      const rightSt   = states[i + 1];
      const flowCls   = leftDone && rightSt === 'st-active' ? 'fl-active'
                      : leftDone ? 'fl-done' : '';
      const stroke    = flowCls === 'fl-done' ? '#1a5c30' : flowCls === 'fl-active' ? '#6366f1' : '#1e2030';
      html += `<div class="connector">
        <svg class="conn-svg" viewBox="0 0 44 8" preserveAspectRatio="none">
          <line x1="0" y1="4" x2="38" y2="4" class="conn-line ${flowCls}"/>
          <polyline points="34,1 40,4 34,7" fill="none" stroke="${stroke}" stroke-width="1.5" class="conn-arrow"/>
        </svg>
      </div>`;
    }
  });
  el.innerHTML = html;
}

// ─── Master render ────────────────────────────────────────────────────────
function render(view) {
  const strip = document.getElementById('pipeline-strip');
  strip.style.display = view === 'upload' ? 'none' : 'flex';
  if (view !== 'upload') renderPipeline(view);

  document.getElementById('new-btn').style.display = view !== 'upload' ? 'flex' : 'none';
  const resetBtn = document.getElementById('reset-btn');
  if (resetBtn) resetBtn.style.display = view !== 'upload' ? 'flex' : 'none';

  const el = document.getElementById('content');
  switch (view) {
    case 'upload':       el.innerHTML = renderUpload();       break;
    case 'working':      el.innerHTML = renderWorking();      break;
    case 'shortlist':    el.innerHTML = renderShortlist();    break;
    case 'sim_result':   el.innerHTML = renderSimResult();    break;
    case 'call_sim':     el.innerHTML = renderCallSim();      break;
    case 'conversation': el.innerHTML = renderConversation(); break;
    case 'calling':      el.innerHTML = renderCalling();      break;
    case 'screening':    el.innerHTML = renderScreening();    break;
    case 'scheduling':         el.innerHTML = renderScheduling();       break;
    case 'onboarding':         el.innerHTML = renderOnboarding();       break;
    case 'onboarding_active':  el.innerHTML = renderOnboardingActive(); break;
    case 'complete':     el.innerHTML = renderComplete();     break;
    case 'error':        el.innerHTML = renderError();        break;
  }
  bindDropHandlers();
}

// ─── Upload ───────────────────────────────────────────────────────────────
function renderUpload() {
  return `
  <div class="upload-hero">
    <h1>智能招聘自动化</h1>
    <p>上传职位描述和候选人简历<br>多智能体流水线自动完成筛选、电话预筛选和审批</p>
  </div>
  <div class="upload-grid">
    <div>
      <div class="upload-label">职位描述 (JD)</div>
      <div class="dropzone" id="jd-zone">
        <input type="file" id="jd-input" accept=".pdf,.docx,.txt" onchange="onJdPick(this)"/>
        <div class="dz-icon">JD</div>
        <div class="dz-label">拖拽 JD 文件或点击选择</div>
        <div class="dz-hint">.pdf · .docx · .txt</div>
      </div>
      <div id="jd-chips" class="file-chips"></div>
    </div>
    <div>
      <div class="upload-label">候选人简历 <span style="font-weight:400;color:var(--muted)">(支持批量上传)</span></div>
      <div class="dropzone" id="resume-zone">
        <input type="file" id="resume-input" accept=".pdf,.docx" multiple onchange="onResumePick(this)"/>
        <div class="dz-icon">CV</div>
        <div class="dz-label">拖拽简历文件或点击选择</div>
        <div class="dz-hint">.pdf · .docx · 最多 100 个文件</div>
      </div>
      <div id="resume-chips" class="file-chips"></div>
    </div>
  </div>
  <button class="btn btn-primary" id="start-btn" onclick="startWorkflow()" disabled>
    启动流程 →
  </button>
  <!-- DEBUG BUTTON — commented out for production
  <div style="text-align:center;margin-top:14px">
    <button class="btn btn-ghost" style="font-size:12px;padding:6px 16px" onclick="debugSkipToOnboarding()">
      🛠 Debug: Skip to Onboarding
    </button>
  </div>
  -->`;
}

// ─── Working / agent active ───────────────────────────────────────────────
function renderWorking() {
  const info = agentInfo();
  return `
  <div class="agent-stage">
    <div class="glow-ring">${info.icon}</div>
    <div class="agent-pill"><div class="agent-pill-dot"></div>智能体运行中</div>
    <div class="agent-title">${info.name}</div>
    <div class="agent-desc">${info.desc}</div>
  </div>`;
}

function agentInfo() {
  const step = S.status?.current_step || '';
  const n = S.status?.resume_filenames?.length || '';
  if (!step || step === 'initialized')
    return { icon:'📄', name:'简历解析器', desc:'正在解析所有上传的简历文件…' };
  if (step === 'parse_uploads')
    return { icon:'AI', name:'短名单智能体', desc:`正在对 ${n} 份简历进行评分排序…` };
  if (step === 'shortlist_resumes')
    return { icon:'⏳', name:'编排器', desc:'短名单生成完毕 — 等待招聘官审核…' };
  if (step === 'hitl_shortlist')
    return { icon:'AI', name:'预筛选智能体', desc:'已批准！正在向候选人发起电话预筛选…' };
  if (step === 'pre_screening_approved')
    return { icon:'AI', name:'面试安排智能体', desc:'预筛选已批准！正在查询日历并安排面试…' };
  if (step === 'onboarding_approved')
    return { icon:'AI', name:'入职通知智能体', desc:'正在向选定的候选人发送入职祝贺邮件…' };
  return { icon:'...', name:'处理中', desc:'请稍候…' };
}

// ─── Upload handlers ──────────────────────────────────────────────────────
let jdFile = null, resumeFiles = [];

function bindDropHandlers() {
  setupDrop('jd-zone', 'jd-input', false);
  setupDrop('resume-zone', 'resume-input', true);
}

function setupDrop(zoneId, inputId, multi) {
  const zone  = document.getElementById(zoneId);
  const input = document.getElementById(inputId);
  if (!zone || !input) return;
  zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drag-over');
    const files = Array.from(e.dataTransfer.files);
    if (multi) { resumeFiles = files; refreshResumes(); }
    else        { jdFile = files[0];  refreshJd(); }
    checkReady();
  });
}

function onJdPick(input)     { jdFile = input.files[0] || null; refreshJd(); checkReady(); }
function onResumePick(input) { resumeFiles = Array.from(input.files); refreshResumes(); checkReady(); }

function refreshJd() {
  const el = document.getElementById('jd-chips');
  const z  = document.getElementById('jd-zone');
  if (!el || !z) return;
  if (!jdFile) { el.innerHTML = ''; z.classList.remove('filled'); return; }
  z.classList.add('filled');
  el.innerHTML = fileChip(jdFile);
}

function refreshResumes() {
  const el = document.getElementById('resume-chips');
  const z  = document.getElementById('resume-zone');
  if (!el || !z) return;
  if (!resumeFiles.length) { el.innerHTML = ''; z.classList.remove('filled'); return; }
  z.classList.add('filled');
  el.innerHTML = resumeFiles.map(fileChip).join('');
}

function fileChip(f) {
  return `<div class="file-chip">
    <span class="fc-name">📄 ${esc(f.name)}</span>
    <span class="fc-size">${(f.size/1024).toFixed(0)} KB</span>
  </div>`;
}

function checkReady() {
  const btn = document.getElementById('start-btn');
  if (btn) btn.disabled = !(jdFile && resumeFiles.length > 0);
}

// ─── Start workflow ───────────────────────────────────────────────────────
async function startWorkflow() {
  if (!jdFile || !resumeFiles.length) return;
  const btn = document.getElementById('start-btn');
  if (btn) { btn.disabled = true; btn.textContent = '上传中…'; }

  const fd = new FormData();
  fd.append('jd_file', jdFile);
  resumeFiles.forEach(f => fd.append('resume_files', f));

  try {
    const res = await fetch('/api/workflow/start', { method:'POST', body:fd });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    S.sessionId = data.session_id;
    localStorage.setItem('hr_session_id', S.sessionId);
    showChip(S.sessionId);
    S.view = 'working';
    render('working');
    startPolling();
  } catch (e) {
    alert('启动失败：' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Launch Workflow →'; }
  }
}

// ─── HITL decisions ───────────────────────────────────────────────────────
let _fbVisible = {};

function toggleFb(gate) {
  _fbVisible[gate] = !_fbVisible[gate];
  const box = document.getElementById(`fb-${gate}`);
  if (box) box.style.display = _fbVisible[gate] ? 'block' : 'none';
}

// 保存拒绝原因，防止被渲染清空
let _rejectFeedback = {};

async function decide(gate, decision) {
  let feedback = null;
  if (decision === 'rejected') {
    feedback = _rejectFeedback[gate] || '';
    if (!feedback) { alert('请输入拒绝原因'); return; }
  }

  // 短名单批准 → 显示拨打动画 → 生成模拟结果 → 显示结果
  if (gate === 'shortlist' && decision === 'approved') {
    await startScreeningWithAnimation();
    return;
  }

  const ep = gate === 'shortlist'
    ? `/api/hitl/${S.sessionId}/shortlist`
    : `/api/hitl/${S.sessionId}/pre-screening`;

  try {
    const res = await fetch(ep, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ decision, feedback }),
    });
    if (!res.ok) {
      let errMsg = `HTTP ${res.status}`;
      try { const e = await res.json(); errMsg = e.detail || errMsg; } catch(_) {}
      throw new Error(errMsg);
    }
    if (decision === 'rejected') {
      // 拒绝成功 → 提示 → 回到初始页面
      alert('已拒绝，流程已重置');
      S.sessionId = null;
      S.status = null;
      S.view = 'upload';
      _rejectFeedback = {};
      _fbVisible = {};
      localStorage.removeItem('hr_session_id');
      stopPolling();
      render('upload');
    } else {
      // 批准后轮询
      await poll();
      startPolling();
    }
  } catch (e) { alert('决策提交失败：' + e.message); }
}

// ── 拨打动画 + 模拟生成 ──────────────────────────────────────────────────
async function startScreeningWithAnimation() {
  const cands = S.status?.shortlisted_candidates || [];
  if (cands.length === 0) return;

  S.view = 'calling'; render('calling');
  stopPolling();

  // 等待 6 秒模拟拨打过程
  await new Promise(r => setTimeout(r, 3000));

  try {
    // 1. 先生成模拟数据（保存到数据库）
    const skipRes = await fetch('/api/conversation/skip', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: S.sessionId, candidates: cands }),
    });
    if (!skipRes.ok) throw new Error('生成模拟数据失败');
    const skipData = await skipRes.json();
    const results = skipData.pre_screening_results || [];

    // 2. 批准短名单（注入预筛选结果到 graph，graph 会跳过预筛选步骤）
    const approveRes = await fetch(`/api/hitl/${S.sessionId}/shortlist`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ decision: 'approved' }),
    });
    if (!approveRes.ok) throw new Error('批准短名单失败');

    // 3. 轮询等待 graph 推进
    for (let i = 0; i < 20; i++) {
      await new Promise(r => setTimeout(r, 500));
      const statusRes = await fetch(`/api/workflow/${S.sessionId}/status`);
      if (statusRes.ok) {
        const statusData = await statusRes.json();
        S.status = statusData;
      }
    }

    // 4. 显示预筛选结果
    S.view = 'screening'; render('screening');
  } catch (e) {
    console.error('Screening error:', e);
    alert('预筛选失败：' + e.message);
    S.view = 'shortlist'; render('shortlist');
  }
}

function generateScreeningSummary(r) {
  const parts = [`${r.name}的预筛选结果：`];
  if (r.looking_for_change) parts.push('有意向换工作。');
  if (r.reason_for_change) parts.push(`原因是${r.reason_for_change}。`);
  if (r.experience_years) parts.push(`工作经验${r.experience_years}。`);
  if (r.current_ctc) parts.push(`当前薪资${r.current_ctc}。`);
  if (r.expected_ctc) parts.push(`期望薪资${r.expected_ctc}。`);
  if (r.interview_slots?.length) parts.push(`可用面试时间：${r.interview_slots.join('和')}。`);
  return parts.join('');
}

// 确认预筛选结果 → 批准短名单，推进 graph
async function confirmCallSim() {
  // 批准预筛选（推进到下一步）
  await fetch(`/api/hitl/${S.sessionId}/pre-screening`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ decision: 'approved' }),
  });

  // 轮询等待 graph 推进
  for (let i = 0; i < 15; i++) {
    await new Promise(r => setTimeout(r, 500));
    const res = await fetch(`/api/workflow/${S.sessionId}/status`);
    if (res.ok) {
      const data = await res.json();
      S.status = data;
      const step = data.current_step || '';
      if (step === 'emails_sent' || step === 'onboarding_pending' || step === 'onboarding_complete') break;
    }
  }

  startPolling();
}

// ─── Helpers ──────────────────────────────────────────────────────────────
function callBadge(status) {
  const m = {
    in_progress: { cls:'sb-calling',   label:'通话中',   prefix:'<span class="spinner"></span>' },
    completed:   { cls:'sb-completed', label:'已完成',   prefix:'' },
    failed:      { cls:'sb-failed',    label:'失败',     prefix:'' },
    no_answer:   { cls:'sb-noanswer',  label:'未接听',   prefix:'' },
    'no-answer': { cls:'sb-noanswer',  label:'未接听',   prefix:'' },
    busy:        { cls:'sb-noanswer',  label:'忙线',     prefix:'' },
    waiting:     { cls:'sb-waiting',   label:'等待中',   prefix:'' },
    simulated:   { cls:'sb-completed', label:'模拟数据', prefix:'' },
  };
  return m[status] || { cls:'sb-waiting', label: status || '等待中', prefix:'' };
}

function showChip(sid) {
  const el = document.getElementById('session-chip');

}

function resetWorkflow() {
  if (!confirm('确定要重置整个流程吗？当前进度将丢失。')) return;

  S.sessionId = null; S.status = null; S.callDetails = null; S.view = 'upload'; S.onboardingSubmitted = false;
  Conv.active = false; Conv.results = []; Conv.candidatesQueue = [];
  _rejectFeedback = {}; _fbVisible = {};

function newSession() {

  Conv.active = false; Conv.results = []; Conv.candidatesQueue = [];

function esc(s) {

}

function openDrawer(idx) {

  document.getElementById('overlay').classList.remove('open');
}

function drawerContent(idx) {
  if (idx === 0) {
    const cands = S.status?.shortlisted_candidates || [];
    if (!cands.length) return '<p style="color:var(--muted)">暂无数据。</p>';
    return cands.map(c => {
      const r = 20, circ = 2 * Math.PI * r, fill = circ * (c.match_score / 10), gap = circ - fill;
      return `
      <div class="cand-card" style="margin-bottom:10px">
        <div class="cand-row">
          <div><div class="cand-name">${esc(c.name)}</div><div class="cand-role">${esc(c.current_role||'—')}</div></div>
          <div class="score-donut">
            <svg viewBox="0 0 50 50"><circle class="donut-bg" cx="25" cy="25" r="${r}"/>
            <circle class="donut-fill" cx="25" cy="25" r="${r}" stroke="#22c55e" stroke-dasharray="${fill} ${gap}"/></svg>

        <div class="cand-reason">${esc(c.selection_reason||'')}</div>

  }
  if (idx === 1) {
    const sl  = S.status?.shortlist_approval_status || '—';
    const fb  = S.status?.shortlist_approval_feedback || '—';
    const rat = S.status?.shortlisting_rationale || '—';
    const cls = sl === 'approved' ? 'rf-yes' : sl === 'rejected' ? 'rf-no' : '';
    return `
      <div class="res-field" style="margin-bottom:8px"><div class="rf-label">审批决策</div>
        <div class="rf-val ${cls}">${sl.toUpperCase()}</div></div>
      <div class="res-field" style="margin-bottom:8px"><div class="rf-label">反馈意见</div>
        <div class="rf-val">${esc(fb)}</div></div>

        <div class="rf-val" style="line-height:1.7;font-size:12px;color:var(--muted2)">${esc(rat)}</div></div>`;
  }
  if (idx === 2 || idx === 3) {
    const results = screeningResults();

    return results.map(r => {
      const lfc = r.looking_for_change;
      const lfcHtml = lfc === true ? '<span class="rf-val rf-yes">是</span>'
                    : lfc === false ? '<span class="rf-val rf-no">否</span>'
                    : '<span class="rf-val">—</span>';
      const { cls, label } = callBadge(r.call_status || '');
      return `
      <div class="res-card" style="margin-bottom:10px">
        <div class="res-head"><div class="res-name">${esc(r.name)}</div>
          <span class="sbadge ${cls}">${label}</span></div>
        <div class="res-grid">
          <div class="res-field"><div class="rf-label">求职意向</div>${lfcHtml}</div>
          <div class="res-field"><div class="rf-label">工作经验</div><div class="rf-val">${esc(r.experience_years||'—')}</div></div>
          <div class="res-field"><div class="rf-label">当前薪资</div><div class="rf-val">${esc(r.current_ctc||'—')}</div></div>
          <div class="res-field"><div class="rf-label">期望薪资</div><div class="rf-val">${esc(r.expected_ctc||'—')}</div></div>
          <div class="res-field" style="grid-column:1/-1"><div class="rf-label">换工作原因</div><div class="rf-val">${esc(r.reason_for_change||'—')}</div></div>
          <div class="res-field" style="grid-column:1/-1"><div class="rf-label">可用面试时间</div><div class="rf-val">${(r.interview_slots||[]).map(s=>esc(s)).join('<br>') || '—'}</div></div>

    }).join('');

  if (idx === 4) {
    const esr = S.status?.email_scheduling_results || [];
    if (!esr.length) return '<p style="color:var(--muted)">暂无安排数据。</p>';
    return esr.map(r => {
      const statusLabel = r.status === 'scheduled'    ? '已安排'
                        : r.status === 'no_slots'     ? '未提供时间'
                        : '未找到空闲时段';

          <div class="res-field" style="grid-column:1/-1"><div class="rf-label">安排的时间</div><div class="rf-val">${esc(r.scheduled_slot||'—')}</div></div>
          ${r.calendar_link ? `<div class="res-field" style="grid-column:1/-1"><div class="rf-label">日历事件</div><div class="rf-val"><a href="${esc(r.calendar_link)}" target="_blank" style="color:var(--accent)">在飞书日历中打开 →</a></div></div>` : ''}
          ` : ''}
        </div>
      </div>`;
    }).join('');

  if (idx === 5) {
    const obr = S.status?.onboarding_results || [];
    if (!obr.length) return '<p style="color:var(--muted)">暂无入职数据。</p>';
    return obr.map(r => {
      const cls = r.status === 'sent' ? 'rf-yes' : 'rf-no';

  return '<p style="color:var(--muted)">暂无数据。</p>';
}

// ─── Conversation Engine (语音对话预筛选) ───────────────────────────────────
const Conv = {
  active: false,
  candidateId: null,
  candidateName: '',
  messages: [],        // [{role:'agent'|'user', text:'', audioUrl:''}]
  isRecording: false,
  recognition: null,
  currentAudio: null,
  candidatesQueue: [], // 待对话的候选人列表
  currentIndex: 0,
  results: [],         // 已完成的预筛选结果
};

function renderConversation() {
  const c = Conv;
  const msgsHtml = c.messages.map(m => {
    const isAgent = m.role === 'agent';
    return `
    <div class="conv-bubble ${isAgent ? 'agent' : 'user'}">
      <div class="conv-avatar">${isAgent ? 'AI' : 'CV'}</div>
      <div>
        <div class="conv-msg">${esc(m.text)}</div>
        ${m.audioUrl ? `<button class="conv-audio-btn" onclick="playConvAudio('${esc(m.audioUrl)}')">🔊 播放语音</button>` : ''}
      </div>
    </div>`;
  }).join('');

  const queueInfo = c.candidatesQueue.length > 1
    ? `<div style="font-size:12px;color:var(--muted2);margin-top:4px">
        候选人 ${c.currentIndex + 1}/${c.candidatesQueue.length}：
        ${esc(c.candidateName)}
       </div>`
    : '';

  return `
  <div class="conv-container">
    <div class="conv-header">
      <h2>AI 电话预筛选</h2>
      <p>与 AI 助手对话，回答关于求职意向、薪资和面试时间的问题</p>
      ${queueInfo}
    </div>
    <div class="conv-chat" id="conv-chat">${msgsHtml}</div>
    <div class="conv-status" id="conv-status"></div>
    <div class="conv-controls">
      <button class="conv-mic-btn" id="conv-mic" onclick="toggleMic()" title="按住说话">🎤</button>
      <textarea class="conv-input" id="conv-input" rows="1" placeholder="输入消息或点击麦克风语音输入…"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendConvMessage()}"></textarea>
      <button class="conv-send-btn" id="conv-send" onclick="sendConvMessage()" disabled>➤</button>
    </div>
    <div class="conv-skip-bar">
      <button class="btn btn-ghost" onclick="skipAllConversations()">⏭ 跳过对话，直接生成模拟数据</button>
      <button class="btn btn-ghost" onclick="nextCandidate()" id="conv-next-btn" style="display:none">下一位候选人 →</button>
    </div>
  </div>`;
}

async function startConversation(candidate) {
  Conv.active = true;
  Conv.candidateId = candidate.candidate_id;
  Conv.candidateName = candidate.name;
  Conv.messages = [];
  render('conversation');

  setConvStatus('正在连接…');

  try {
    const res = await fetch('/api/conversation/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        session_id: S.sessionId,
        candidate_id: candidate.candidate_id,
        candidate_name: candidate.name,
        candidate_skills: candidate.skills || [],
      }),
    });
    const data = await res.json();

    Conv.messages.push({role: 'agent', text: data.greeting, audioUrl: data.audio_url});
    render('conversation');
    scrollConvChat();

    if (data.audio_url) playConvAudio(data.audio_url);
    setConvStatus('');
  } catch (e) {
    setConvStatus('连接失败：' + e.message);
  }
}

async function sendConvMessage() {
  const input = document.getElementById('conv-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  document.getElementById('conv-send').disabled = true;

  Conv.messages.push({role: 'user', text: text});
  render('conversation');
  scrollConvChat();
  setConvStatus('思考中…');

  try {
    const res = await fetch('/api/conversation/message', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        session_id: S.sessionId,
        candidate_id: Conv.candidateId,
        text: text,
      }),
    });
    const data = await res.json();

    Conv.messages.push({role: 'agent', text: data.reply, audioUrl: data.audio_url});
    render('conversation');
    scrollConvChat();

    if (data.audio_url) playConvAudio(data.audio_url);

    if (data.is_complete) {
      Conv.results.push({
        candidate_id: Conv.candidateId,
        name: Conv.candidateName,
        ...data.structured_result,
      });
      setConvStatus('对话完成');

      if (Conv.currentIndex < Conv.candidatesQueue.length - 1) {
        document.getElementById('conv-next-btn').style.display = '';
      } else {
        // 所有候选人对话完成
        setConvStatus('所有对话已完成，正在提交结果…');
        await submitConversationResults();
      }
    } else {
      setConvStatus('');
    }
  } catch (e) {
    setConvStatus('发送失败：' + e.message);
  }
}

function nextCandidate() {
  Conv.currentIndex++;
  const next = Conv.candidatesQueue[Conv.currentIndex];
  if (next) startConversation(next);
}

async function skipAllConversations() {
  setConvStatus('正在生成模拟数据…');
  try {
    const res = await fetch('/api/conversation/skip', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        session_id: S.sessionId,
        candidates: Conv.candidatesQueue,
      }),
    });
    const data = await res.json();
    Conv.results = data.pre_screening_results || [];
    await submitConversationResults();
  } catch (e) {
    setConvStatus('跳过失败：' + e.message);
  }
}

async function submitConversationResults() {
  try {
    setConvStatus('正在保存对话结果…');

    // 1. 保存预筛选结果到会话状态
    await fetch('/api/conversation/submit-results', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        session_id: S.sessionId,
        results: Conv.results,
      }),
    });

    setConvStatus('正在推进工作流…');

    // 2. 批准短名单（触发后端 graph 恢复，但 pre_screening_node 会跳过）
    await fetch(`/api/hitl/${S.sessionId}/shortlist`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({decision: 'approved'}),
    });

    // 3. 等待 graph 走到 hitl_pre_screening，然后自动批准
    //    轮询等待 pre_screening_approval_status 变为 pending
    let retries = 0;
    while (retries < 20) {
      await new Promise(r => setTimeout(r, 500));
      const res = await fetch(`/api/workflow/${S.sessionId}/status`);
      const data = await res.json();
      if (data.pre_screening_approval_status === 'pending' && data.pre_screening_results?.length > 0) {
        // graph 已到达 hitl_pre_screening，自动批准
        await fetch(`/api/hitl/${S.sessionId}/pre-screening`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({decision: 'approved'}),
        });
        break;
      }
      retries++;
    }

    Conv.active = false;
    startPolling();
    render('working');
  } catch (e) {
    setConvStatus('提交失败：' + e.message);
  }
}

function toggleMic() {
  if (Conv.isRecording) {
    stopMic();
  } else {
    startMic();
  }
}

function startMic() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('你的浏览器不支持语音识别，请使用 Chrome 或 Edge');
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onresult = (event) => {
    const transcript = Array.from(event.results)
      .map(r => r[0].transcript).join('');
    document.getElementById('conv-input').value = transcript;
    document.getElementById('conv-send').disabled = !transcript.trim();
  };

  recognition.onend = () => {
    Conv.isRecording = false;
    const btn = document.getElementById('conv-mic');
    if (btn) btn.classList.remove('recording');
    // 自动发送
    const input = document.getElementById('conv-input');
    if (input && input.value.trim()) sendConvMessage();
  };

  recognition.onerror = (e) => {
    console.error('Speech recognition error:', e.error);
    Conv.isRecording = false;
    const btn = document.getElementById('conv-mic');
    if (btn) btn.classList.remove('recording');
    if (e.error === 'not-allowed') {
      alert('请允许麦克风权限');
    }
  };

  recognition.start();
  Conv.isRecording = true;
  Conv.recognition = recognition;
  const btn = document.getElementById('conv-mic');
  if (btn) btn.classList.add('recording');
  setConvStatus('🎤 正在聆听…');
}

function stopMic() {
  if (Conv.recognition) {
    Conv.recognition.stop();
  }
  Conv.isRecording = false;
  const btn = document.getElementById('conv-mic');
  if (btn) btn.classList.remove('recording');
}

function playConvAudio(url) {
  if (Conv.currentAudio) {
    Conv.currentAudio.pause();
  }
  const audio = new Audio(url);
  Conv.currentAudio = audio;
  audio.play().catch(() => {});
}

function setConvStatus(msg) {
  const el = document.getElementById('conv-status');
  if (el) el.innerHTML = msg ? `<span class="spinner"></span>${esc(msg)}` : '';
}

function scrollConvChat() {
  const el = document.getElementById('conv-chat');
  if (el) setTimeout(() => el.scrollTop = el.scrollHeight, 50);
}

// 输入框监听
document.addEventListener('input', (e) => {
  if (e.target.id === 'conv-input') {
    const btn = document.getElementById('conv-send');
    if (btn) btn.disabled = !e.target.value.trim();
  }
});
</script>
